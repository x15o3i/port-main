    <!-- Form Submit Handler JS -->
    <script>
        function sendContactForm(e) {
            e.preventDefault();
            const name = document.getElementById('c-name').value.trim();
            const email = document.getElementById('c-email').value.trim();
            const message = document.getElementById('c-message').value.trim();

            // Show Toast Badge
            let toast = document.getElementById('formToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'formToast';
                toast.className = 'toast-notification';
                toast.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Message Sent! Opening email client…';
                document.body.appendChild(toast);
            }

            requestAnimationFrame(() => {
                toast.classList.add('is-visible');
            });

            const mailto = `mailto:raphaelfulfileed@gmail.com?subject=${encodeURIComponent('Project Inquiry from ' + name)}&body=${encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\n' + message)}`;

            setTimeout(() => {
                window.location.href = mailto;
            }, 500);

            const btn = document.getElementById('contact-submit-btn');
            btn.textContent = 'Sent! ✨';
            btn.disabled = true;

            setTimeout(() => {
                toast.classList.remove('is-visible');
                btn.textContent = 'Submit';
                btn.disabled = false;
                document.getElementById('c-name').value = '';
                document.getElementById('c-email').value = '';
                document.getElementById('c-message').value = '';
            }, 4000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('mobileToggle');
            const navLinks = document.getElementById('navLinks');
            if (toggle && navLinks) {
                toggle.addEventListener('click', () => {
                    const expanded = navLinks.classList.toggle('nav-active');
                    toggle.classList.toggle('is-open');
                    toggle.setAttribute('aria-expanded', expanded);
                });
            }
        });
    </script>
